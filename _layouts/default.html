<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- MODERN FONT: Inter (Optimized for speed) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="AwSx8fOEbPm6Tlvarv8CFakRWVvQPGpzBleUiKPCrkQ" />
    
    <!-- CRITICAL SEO TAGS -->
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | truncate: 160 }}">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url | remove: 'index.html' }}">
    
    <!-- Open Graph for Social Sharing -->
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description | truncate: 160 }}">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url | remove: 'index.html' }}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/banner-ai-dictionary-1.png">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | truncate: 160 }}">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/banner-ai-dictionary-1.png">

    <!-- PWA & Apple App Meta Tags -->
    <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
    <meta name="theme-color" content="#002b4d">

    <!-- CRITICAL: Explicit Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icon-180.png' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icon-180.png' | relative_url }}">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Dictionary">
    
    <!-- STRUCTURED DATA LOGIC -->
    {% if page.url == '/' or page.url == '/index.html' or page.url == site.baseurl or page.url == site.baseurl | append: '/' %}
    
      <!-- Homepage Schema: DefinedTermSet + FAQPage -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "DefinedTermSet",
        "name": "AI Dictionary of Terms",
        "description": "A curated dictionary of artificial intelligence and machine learning terminology.",
        "url": "{{ site.url }}{{ site.baseurl }}/",
        "hasDefinedTerm": [
          { "@type": "DefinedTerm", "name": "Artificial Intelligence", "description": "The simulation of human intelligence processes by machines." },
          { "@type": "DefinedTerm", "name": "Machine Learning", "description": "A subset of AI that enables systems to learn from data." },
          { "@type": "DefinedTerm", "name": "Large Language Model", "description": "A type of AI model trained on vast text data to understand and generate human language." }
        ]
      }
      </script>

      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          { "@type": "Question", "name": "What is an AI dictionary?", "acceptedAnswer": { "@type": "Answer", "text": "An AI dictionary is a reference resource that defines artificial intelligence and machine learning terms in plain language, making complex concepts accessible to everyone." } },
          { "@type": "Question", "name": "How many terms are in this AI terminology glossary?", "acceptedAnswer": { "@type": "Answer", "text": "This living dictionary contains 210+ AI and machine learning terms across 8 specialized categories, ranging from foundational Architecture to Legal AI and Healthcare AI." } },
          { "@type": "Question", "name": "Who is this AI dictionary for?", "acceptedAnswer": { "@type": "Answer", "text": "It is built for everyone. Every term includes a Simple Version written in plain English for beginners, alongside detailed technical definitions and code examples." } },
          { "@type": "Question", "name": "Is this AI dictionary free to use?", "acceptedAnswer": { "@type": "Answer", "text": "Yes! This is an open-source project licensed under the MIT License. You are free to use, share, and contribute to this machine learning glossary." } }
        ]
      }
      </script>

    {% else %}

      <!-- Term Page Schema: DefinedTerm (Enhanced for AI Scrapers & SEO) -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "DefinedTerm",
        "name": "{{ page.title }}",
        "description": "{{ page.description | strip_html | truncate: 160 }}",
        "url": "{{ site.url }}{{ site.baseurl }}{{ page.url | remove: 'index.html' }}",
        "inDefinedTermSet": {
          "@type": "DefinedTermSet",
          "name": "AI Dictionary of Terms",
          "url": "{{ site.url }}{{ site.baseurl }}/"
        },
        "author": {
          "@type": "Person",
          "name": "Alex Nubla",
          "url": "https://www.linkedin.com/in/alexnubla/"
        }
      }
      </script>

    {% endif %}

    <style>
        /* MODERN FONT: Inter with crisp rendering */
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            line-height: 1.6; 
            color: #24292f; 
            background-color: #ffffff; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        img { max-width: 100%; height: auto; border-radius: 12px; }
        
        /* Header Styles */
        header { background-color: #f6f8fa; border-bottom: 1px solid #d0d7de; padding: 15px 0; }
        .header-content { max-width: 900px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; }
        .site-title { font-size: 1.5rem; font-weight: 700; color: #0969da; text-decoration: none; }
        .site-title:hover { text-decoration: underline; }

        /* Table Styles */
        table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 0.95rem; }
        th, td { border: 1px solid #d0d7de; padding: 10px 15px; text-align: left; }
        th { background-color: #f6f8fa; font-weight: 600; }
        tr:nth-child(even) { background-color: #f9f9f9; }

        /* NEW: Clean up Google Translate UI to match your modern aesthetic */
        .goog-te-banner-frame { display: none !important; }
        body { top: 0px !important; }
        .goog-te-gadget { font-family: 'Inter', sans-serif !important; font-size: 14px !important; color: #24292f !important; }
        .goog-te-gadget-simple { 
            background-color: #ffffff !important; 
            border: 1px solid #d0d7de !important; 
            padding: 6px 12px !important; 
            border-radius: 6px !important; 
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .goog-te-gadget-simple:hover {
            background-color: #f3f4f6 !important;
        }
        .goog-te-menu-value span { color: #24292f !important; }
    </style>
</head>

<body>
    <!-- Register Service Worker for Offline PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}')
            .then(registration => {
              console.log('AI Dictionary PWA registered successfully!');
            })
            .catch(registrationError => {
              console.log('PWA registration failed: ', registrationError);
            });
        });
      }
    </script>

    <!-- Site Header -->
    <header>
        <div class="header-content">
            <a href="{{ site.baseurl }}/" class="site-title">{{ site.title }}</a>
            <!-- NEW: Google Translate Widget Container -->
            <div id="google_translate_element"></div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        {{ content }}
    </div>

    <!-- NEW: Google Translate Widget Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'zh-CN,es,fr,ja,pt', /* Chinese, Spanish, French, Japanese, Portuguese */
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- NEW: Protect Term Titles from Translation -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Finds the first H1 on the page (which Markdown renders as the Term Name)
            // and applies both the W3C standard and Google-specific bypass attributes.
            const termTitle = document.querySelector('h1');
            if (termTitle) {
                termTitle.setAttribute('translate', 'no');
                termTitle.classList.add('notranslate');
            }
        });
    </script>
</body>
</html>

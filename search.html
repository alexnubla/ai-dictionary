---
layout: default
title: Search Dictionary
---

<style>
  .search-container { max-width: 800px; margin: 0 auto; padding: 20px; }
  #searchInput { 
    width: 100%; padding: 15px; font-size: 1.1em; 
    border: 2px solid #ddd; border-radius: 8px; margin-bottom: 20px;
  }
  #searchInput:focus { outline: none; border-color: #0366d6; }
  .result-item { 
    padding: 15px; border-bottom: 1px solid #eee; 
    transition: background 0.2s;
  }
  .result-item:hover { background: #f6f8fa; }
  .result-item a { font-size: 1.2em; font-weight: 600; color: #0366d6; text-decoration: none; }
  .result-item a:hover { text-decoration: underline; }
  .result-category { color: #6a737d; font-size: 0.9em; margin-left: 10px; }
  .no-results { color: #6a737d; text-align: center; margin-top: 40px; }
</style>

<div class="search-container">
  <h1>🔍 Search the AI Dictionary</h1>
  <input type="text" id="searchInput" placeholder="Type a term (e.g., Transformer, RAG, LoRA)...">
  <div id="results"></div>
</div>

<script>
// Jekyll generates this array of all terms at build time
const terms = [
  {% assign term_pages = site.pages | where_exp: "item", "item.path contains 'terms/'" %}
  {% for page in term_pages %}
    { 
      title: "{{ page.title | escape }}", 
      url: "{{ page.url | relative_url }}", 
      category: "{{ page.category | escape }}" 
    }{% unless forloop.last %},{% endunless %}
  {% endfor %}
];

const searchInput = document.getElementById('searchInput');
const resultsDiv = document.getElementById('results');

searchInput.addEventListener('input', function(e) {
  const query = e.target.value.toLowerCase().trim();
  
  if (query.length < 2) {
    resultsDiv.innerHTML = '<p class="no-results">Type at least 2 characters to search...</p>';
    return;
  }
  
  const results = terms.filter(t => 
    t.title.toLowerCase().includes(query) || 
    t.category.toLowerCase().includes(query)
  );
  
  if (results.length > 0) {
    resultsDiv.innerHTML = results.map(t => `
      <div class="result-item">
        <a href="${t.url}">${t.title}</a>
        <span class="result-category">(${t.category})</span>
      </div>
    `).join('');
  } else {
    resultsDiv.innerHTML = '<p class="no-results">No terms found. Try a different keyword.</p>';
  }
});

// Initialize with empty state
resultsDiv.innerHTML = '<p class="no-results">Type at least 2 characters to search...</p>';
</script>

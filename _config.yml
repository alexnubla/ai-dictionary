title: "AI Dictionary of Terms"
description: "A curated, living dictionary of AI/ML terminology with clear, accessible explanations."
url: "" # Leave empty for GitHub Pages root
baseurl: "" # Leave empty for GitHub Pages root

# Include folders that Jekyll should process
include:
  - terms
  - categories

# Default settings for pages
defaults:
  - scope:
      path: "" # Applies to all files
    values:
      layout: "default"

# Plugins (GitHub Pages supports these natively)
plugins:
  - jekyll-feed
  - jekyll-sitemap

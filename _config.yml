title: "AI Dictionary of Terms"
description: "A curated, living dictionary of AI/ML terminology with clear, accessible explanations."
url: "https://alexnubla.github.io"
baseurl: "/ai-dictionary"

# Jekyll automatically processes folders containing files with YAML front matter.
# No need to explicitly include 'terms' or 'categories'.

permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-sitemap

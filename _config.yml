title: "AI Dictionary of Terms"
description: "A curated, living dictionary of AI/ML terminology with clear, accessible explanations."
url: "https://alexnubla.github.io"
baseurl: "/ai-dictionary" # <--- THIS IS THE CRITICAL FIX

include:
  - terms
  - categories

# Ensures clean URLs with trailing slashes (e.g., /categories/architecture/)
permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-sitemap
